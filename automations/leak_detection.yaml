alias: "Garden Irrigation - Leak Alert"
description: >
  Sends an urgent notification when the irrigation system detects a possible
  water leak (flow sensor active outside watering sessions).
trigger:
  - platform: state
    entity_id: sensor.garden_irrigation_status
    to: "leak_detected"
condition: []
action:
  - service: notify.notify
    data:
      title: "🚨 Waterlek gedetecteerd!"
      message: >
        De flowmeter registreert waterflow buiten bewateringstijden.
        Controleer direct de leidingen en kleppen.
        Status: {{ states('sensor.garden_irrigation_status') }}
  - service: persistent_notification.create
    data:
      title: "Waterlek gedetecteerd"
      message: >
        Garden Irrigation heeft een mogelijk lek gedetecteerd.
        Bekijk de entiteit sensor.garden_irrigation_status voor details.
      notification_id: garden_irrigation_leak
mode: single
