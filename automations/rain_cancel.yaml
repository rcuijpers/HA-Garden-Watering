alias: "Garden Irrigation - Rain Cancel"
description: >
  Cancels any active or scheduled watering session when the watering advice
  changes to 'skip' (rain threshold exceeded).
trigger:
  - platform: state
    entity_id: sensor.garden_irrigation_advice_zone_1
    to: "skip"
  # Add additional zone advice sensors here if you have more zones
condition:
  - condition: not
    conditions:
      - condition: state
        entity_id: sensor.garden_irrigation_status
        state: idle
action:
  - service: button.press
    target:
      entity_id: button.garden_irrigation_stop_all
  - service: notify.notify
    data:
      title: "🌧️ Bewatering geannuleerd"
      message: >
        De bewatering is gestopt wegens verwachte neerslag.
        Regenvoorspelling overschrijdt de ingestelde drempel.
mode: single
